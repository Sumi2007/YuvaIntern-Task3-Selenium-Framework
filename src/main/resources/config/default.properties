# ---------------------------------------------------------------
# Default configuration (lowest precedence).
# Precedence (highest -> lowest):
#   1. JVM system property        -Dbrowser=firefox
#   2. OS environment variable    QA_BROWSER=firefox   (prefix QA_, dots -> underscores, upper-case)
#   3. Environment file           config/<env>.properties   (env chosen by -Denv=ci or QA_ENV=ci)
#   4. This file
# ---------------------------------------------------------------

# Application under test
app.base.url=https://qa-practice.razvanvancea.ro
app.login.path=/auth_ecommerce.html

# Public demo credentials published on the practice page.
# In a real project, supply the password via QA_APP_USER_PASSWORD (never commit it).
app.user.email=admin@admin.com
app.user.password=admin123

# Browser
browser=chrome
headless=false
maximize=true
# Empty = run locally. Example: http://localhost:4444  (Selenium Grid / Docker)
grid.url=

# Timeouts (seconds). Only explicit waits are used - no implicit waits.
explicit.wait.seconds=15
short.wait.seconds=3
page.load.timeout.seconds=30

# Reporting / resilience
report.dir=target/reports
screenshot.dir=target/screenshots
screenshot.on.failure=true
retry.count=0
